services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: huginn-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MAP_STORAGE_PATH: /app/map-storage
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      WURMMAPS_EVENT_FEED_TIMEOUT_MS: ${WURMMAPS_EVENT_FEED_TIMEOUT_MS:-3000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:3014:3000"
    volumes:
      - map-storage:/app/map-storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://$${process.env.HOSTNAME}:3000/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # One-off admin/map seeding. The initial admin password is only passed
  # here, never to the long-running app container. It is optional at the
  # compose level (so `docker compose up` works without it once seeded);
  # seed-admin.mjs rejects a missing or weak password when it has to create
  # the admin, and needs none once that admin exists:
  #   docker compose run --rm seed
  seed:
    command: ["node", "scripts/seed-admin.mjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
    image: huginn-app:latest
    profiles: ["tools"]
    restart: "no"

  sync:
    command: ["node", "scripts/sync-events.mjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    image: huginn-app:latest
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wurm_map_util}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-wurm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  map-storage:
  postgres-data:
