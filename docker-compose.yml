services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wurm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-wurm_map_util}?schema=public
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      MAP_STORAGE_PATH: /app/map-storage
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      WURMMAPS_EVENT_FEED_TIMEOUT_MS: ${WURMMAPS_EVENT_FEED_TIMEOUT_MS:-3000}
      WURMMAPS_STAT_DELEGATE_BASE_URL: ${WURMMAPS_STAT_DELEGATE_BASE_URL:-https://wurmmaps.xyz/APIs/stat-delegate.php}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - map-storage:/app/map-storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://$${process.env.HOSTNAME}:3000/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wurm_map_util}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-wurm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  map-storage:
  postgres-data:
